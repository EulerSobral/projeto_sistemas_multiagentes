train_image_task:
    description: > 
      Estude e compreenda o dataset de imagens que você recebeu 
      Treine o modelo yolov8n.pt com os seguintes parametros
       - name: treino de postes 
      -  epochs: 30 
    expected_output: > 
      retorne o valor da categoria da imagem
    agent: train_analyst

image_analysis_task:
    description: > 
      Com base no conhecimento do agete train_analyst identfique se a imagem tem ou não fibra optica
    expected_output: > 
      Analise a imagem e faça um texto sobre fibra optica, se a imagem for da categoria de fibra optica. 
      Caso a imagem não seja de fibra optica, fale sobre a categoria de postes 
      Escreva o texto no formato de markdown com '```'
    agent: image_analyst